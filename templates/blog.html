{% extends "base.html" %}
{% block title %}Blog{% endblock %}
{% block content %}
<div class = 'page_content'>
    <h1>Blog</h1>
    {% for post in posts %}
        <h2><a href="/blog/{{ post.slug }}">{{ post.title }}</a></h2>
        <p>{{ post.summary }}</p>
    </div>
    {% endfor %}
{% endblock %}
